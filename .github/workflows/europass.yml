name: Generate Europass PDF

on:
  push:
    branches:
      - main

jobs:
  europass:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Run Docker container
      run: docker run -d -p 8888:8888 ghcr.io/validator/validator:latest

    - name: Generate Europass
      run: |
        sudo apt-get update
        sudo apt-get install -yq libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 \
          libc6 libcairo2 libcups2t64 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 \
          libgcc1 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0t64 libnspr4 libpango-1.0-0 \
          libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 \
          libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 \
          libxss1 libxtst6 ca-certificates fonts-liberation libnss3 lsb-release \
          xdg-utils wget
        node ./_scripts/europass.js
        cp ./_scripts/downloads/europass.pdf ./_site/cv/europass.pdf
