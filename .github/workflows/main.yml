name: Build and Deploy GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3 libvips-dev

    - name: Install dependencies
      run: |
        for attempt in 1 2 3 4 5; do
          if yarn install --frozen-lockfile; then
            echo "yarn install succeeded on attempt ${attempt}"
            exit 0
          fi
          echo "yarn install failed on attempt ${attempt}/5"
          if [ "$attempt" -lt 5 ]; then
            rm -rf "$HOME/.cache/yarn"
            echo "retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          fi
        done
        echo "yarn install failed after 5 attempts"
        exit 1

    - name: Run Docker container
      run: docker run -d -p 8888:8888 ghcr.io/validator/validator:latest

    - name: Build the site
      run: npm run build

    - name: Stop Docker container
      run: docker stop $(docker ps -q --filter ancestor=ghcr.io/validator/validator:latest)

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_site
